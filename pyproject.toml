[tool.poetry]
name = "rxn_negative_learning"
version = "0.0.1"
description = "Repository to train reaction models with negative data"
authors = ["ato <ato@zurich.ibm.com>"]
readme = "README.md"
packages = [{include = "rxn_negative_learning", from="src"}]
include = ["rxn_negative_learning/py.typed"]

[tool.poetry_bumpversion.file."src/rxn_negative_learning/__init__.py"]

[[tool.poetry.source]]
name = "PyPI"
priority = "supplemental"

[tool.poetry.dependencies]
python = "^3.10"
torch = "==2.1.2"
click = ">=7.0"
xlrd = "<=1.2.0"
jupyterlab = "==2.2.6"
xxhash = "==3.4.1"
transformers = "==4.30.2"
pytorch_lightning = "==1.9.5"
Levenshtein = "==0.23.0"
rdkit-pypi= "==2021.9.2"
tensorboard= "==2.11.2"
datasets = "==2.17.1"
scikit-learn= "^1.4.1"
rxn-utils = "^1.6.0"
rxn-chem-utils = "^1.4.0"

[tool.poetry.dev-dependencies]
jupyter = "^1.0.0"
mypy = "^1.0.0"
pytest = "^6.2.5"
pytest-cov = "^2.8.1"
ruff = "^0.1.3"
types-setuptools = "^57.4.14"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
convert-jsonl-dataset-to-txt = "rxn_negative_learning.scripts.convert_jsonl_dataset_to_txt:main"
extract-regiosqm-dataset="rxn_negative_learning.scripts.extract_regiosqm_dataset:main"
generate-regiosqm-dataset="rxn_negative_learning.scripts.generate_regiosqm_dataset:main"
generate-buitrago-dataset="rxn_negative_learning.scripts.generate_buitrago_dataset:main"
generate-uspto-dataset="rxn_negative_learning.scripts.generate_uspto_dataset:main"
remove-overlap = "rxn_negative_learning.scripts.remove_overlap:main"
create-vocab="rxn_negative_learning.scripts.create_vocab:main"
split-simple="rxn_negative_learning.scripts.split_simple:main"
generate-multiple-splits =" rxn_negative_learning.scripts.generate_multiple_splits:main"
generate-decreasing-positive-splits = "rxn_negative_learning.scripts.generate_decreasing_positive_splits:main"
save-split-files="rxn_negative_learning.scripts.save_splits_files:main"
vanilla-transformer-training="rxn_negative_learning.scripts.vanilla_transformer_training:main"
vanilla-transformer-testing="rxn_negative_learning.scripts.vanilla_transformer_testing:main"
generate-synthetic-classification-dataset = "rxn_negative_learning.scripts.generate_synthetic_classification_dataset:main"
reward-model-train-mlm = "rxn_negative_learning.scripts.train_mlm:main"
reward-model-eval-mlm = "rxn_negative_learning.scripts.eval_mlm:main"
reward-model-finetune = "rxn_negative_learning.scripts.finetune_scorer:main"
reward-model-eval = "rxn_negative_learning.scripts.eval_scorer:main"
reward-model-train-svm = "rxn_negative_learning.scripts.svm_train:main"
rl-transformer-training ="rxn_negative_learning.scripts.rl_training:main"
generate-baseline-lookup-table = "rxn_negative_learning.scripts.generate_baseline_lookup_table:main"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "tqdm.*",
]
ignore_missing_imports = true

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 100
indent-width = 4

target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
preview = true
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "W291",
    "W292",
    "W505",
    "E721",
    "I",
    "N801",
    "N802",
    "N803",
    "N804",
    "N805",
    "N806",
    "N816",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D300",
    "UP010",
    "UP011",
    "UP019",
    "UP032",
    "ARG",
    "PTH",
    "LOG001",
    "LOG002",
]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
preview = true
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
